# /etc/nginx/sites-available/perfect-intern  (replace example.co.ke with your domain)
# Get certificates first:  sudo certbot --nginx -d example.co.ke -d www.example.co.ke

server {
    listen 80;
    server_name example.co.ke www.example.co.ke;
    return 301 https://example.co.ke$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.co.ke;

    ssl_certificate     /etc/letsencrypt/live/example.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Uploads: CVs up to 5 MB plus form overhead.
    client_max_body_size 6m;

    root /var/www/perfect-intern;   # the contents of client/dist
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content-Security-Policy for the React app. Fonts come from Google Fonts; drop those two hosts if you self-host fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # required: the API trusts one proxy hop for secure cookies and client IPs
        proxy_read_timeout 60s;
    }

    # Optional hardening for the Safaricom callback: allow only Safaricom's published source IPs
    # (get the current list from Safaricom/Daraja docs), then mirror them in MPESA_ALLOWED_IPS.
    # location /api/payments/mpesa/ {
    #     allow <safaricom-ip-1>; allow <safaricom-ip-2>; deny all;
    #     proxy_pass http://127.0.0.1:4000;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Hashed build assets can be cached for a year; index.html must never be.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-store"; }

    # Single-page app: unknown paths fall back to index.html so React Router can handle them.
    location / { try_files $uri /index.html; }
}
