# Optional container deployment (UNTESTED here: treat as a starting point).
# 1. cp .env.docker.example .env.docker and fill it in   2. docker compose --env-file .env.docker up -d --build
# 3. First run only: docker compose --env-file .env.docker run --rm api npm run seed
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /data/uploads
      PORT: "4000"
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "npm run migrate && node src/server.js"

  web:
    build: ./client
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
